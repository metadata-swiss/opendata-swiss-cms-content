name: Trigger Harvesting showcases

on:
  push:
    branches:
      - main
    paths:
      - "showcases/**"
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e.g., prod, staging). Falls back to vars.ENVIRONMENT."
        required: false
        type: string
      ref:
        description: "Git ref on target repo to run the workflow from"
        required: false
        type: string
        default: main
    secrets:
      ODS_GITHUB_APP_ID:
        required: true
      ODS_GITHUB_PRIVATE_KEY:
        required: true
      ODS_GITHUB_INSTALLATION_ID:
        required: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.ODS_GITHUB_APP_ID }}
          private_key: ${{ secrets.ODS_GITHUB_PRIVATE_KEY }}
          installation_id: ${{ secrets.ODS_GITHUB_INSTALLATION_ID }}

      - name: Trigger Piveau Harvester
        run: |
          gh workflow run script-manual-trigger.yaml \
            --repo opendata-swiss/metadata.swiss \
            --ref "${{ inputs.ref || 'main' }}" \
            -f environment=$(echo "${{ inputs.environment || vars.ENVIRONMENT }}" | tr '[:lower:]' '[:upper:]') \
            -f action=HARVEST_SHOWCASES
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
